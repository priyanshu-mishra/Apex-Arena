name: Deploy browser demo to GitHub Pages

on:
  push:
    branches: [main, master, feat/flagship-ui]
    paths:
      - "apps/web-arena/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.40"
      - uses: actions/configure-pages@v5
        id: pages
      - name: Install dependencies
        working-directory: apps/web-arena
        run: bun install --frozen-lockfile
      - name: Export browser demo
        working-directory: apps/web-arena
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bun run build:pages
      - name: Typecheck
        working-directory: apps/web-arena
        run: bun run typecheck
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web-arena/.next-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
